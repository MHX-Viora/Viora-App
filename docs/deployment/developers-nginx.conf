# Add inside the EXISTING mxh.ankt.vn server block after operator review.
# Use its existing root (the Expo dist directory). No new server/domain/upstream.
# Exact static routes precede SPA handling, and unknown docs return real 404.
location = /developers {
    try_files /developers/index.html =404;
}
location = /developers/ {
    return 308 /developers;
}
location = /developers/docs {
    try_files /developers/docs/index.html =404;
}
location = /developers/docs/ {
    return 308 /developers/docs;
}
location ^~ /developers/docs/ {
    try_files $uri/index.html =404;
}
location = /developers/register {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
}
location = /developers/console {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
}
location ^~ /developers/console/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
}
location ^~ /developers-assets/ {
    expires 5m;
    add_header X-Content-Type-Options nosniff;
    # Explicit .mjs MIME avoids application/octet-stream on older mime.types.
    types { text/javascript mjs; text/css css; application/json json; }
    try_files $uri =404;
}
location = /sitemap-developers.xml {
    default_type application/xml;
    try_files $uri =404;
}
# Keep the existing location / SPA fallback, auth/API proxy and security headers.
# Preserve security headers in each location if the current server uses add_header.
# nginx -t must pass before an operator reloads production configuration.
